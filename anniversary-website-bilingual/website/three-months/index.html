<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Happy 3 Months, Stephany</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="../language.css?v=1"><style>#language-switch{position:fixed;top:10px;left:10px;z-index:71}@media(max-width:420px){#language-switch button{padding:5px;font-size:11px}#music{font-size:.9rem;max-width:44%}}</style></head><body>
<button id="music" aria-pressed="false"></button>
<audio id="audio" loop preload="none"></audio>
<section id="intro">
  <div class="trio" id="trio"></div>
  <h1 class="hand" id="title"></h1>
  <p id="sub"></p>
  <div class="env" id="env" role="button" tabindex="0" aria-label="Open the envelope">
    <div class="back"></div>
    <div class="mini" id="mini"><i></i><i></i><i></i><i></i></div>
    <div class="pocket"><i class="pl"></i><i class="pr"></i><i class="pb"></i></div>
    <div class="flap"></div>
    <span class="seal" id="seal"><b>♥</b></span>
  </div>
  <p class="hand tap" id="tap"></p>
  <button id="reopen" class="btn" hidden>Read the letter again</button>
</section>
<div id="veil"></div>
<article id="sheet" aria-label="Letter"><div class="in">
  <button class="x" id="x" aria-label="Close letter">✕</button>
  <h2 class="hand" id="l-to"></h2><div id="l-body"></div>
  <p class="hand sign" id="l-sign"></p>
  <button class="btn" id="close">Keep scrolling</button></div></article>
<main id="book" hidden>
  <h2 class="hand big" id="bookTitle"></h2><p id="since" class="hand"></p><div id="scrap"></div>
  <section id="end"><p class="hand big" id="end1"></p>
  <div id="endpic"></div><p class="hand big red" id="end2"></p></section>
</main>
<script src="js/script.js"></script><a href="../?return=1" style="position:fixed;bottom:12px;right:12px;z-index:9999;background:#fff8f0;color:#873f56;padding:8px 12px;border-radius:20px;font:14px system-ui;text-decoration:none">Return to five months ↗</a><script src="../language.js?v=1"></script></body></html>
